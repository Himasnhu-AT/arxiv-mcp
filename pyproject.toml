[project]
name = "arxiv-mcp"
version = "0.1.0"
description = "Efficient, well-behaved MCP server for arXiv: search, fetch, cache, and read papers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Himanshu" }]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pypdf>=4.2",
]

[project.optional-dependencies]
# Faster/higher-quality PDF extraction. AGPL-3.0 — opt-in only.
fast = ["pymupdf>=1.24"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
arxiv-mcp = "arxiv_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/arxiv_mcp"]
